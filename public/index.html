<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce API</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f5f5f5;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 48px;
        max-width: 560px;
        width: 100%;
        text-align: center;
      }

      .status-badge {
        display: inline-block;
        background: #e6f4ea;
        color: #2e7d32;
        font-size: 13px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 20px;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 12px;
      }

      p {
        color: #666;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .endpoints {
        text-align: left;
        background: #f9f9f9;
        border-radius: 6px;
        padding: 20px 24px;
      }

      .endpoints h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #999;
        margin-bottom: 14px;
      }

      .endpoint {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid #eee;
        font-size: 14px;
      }

      .endpoint:last-child {
        border-bottom: none;
      }

      .method {
        font-weight: 700;
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 4px;
        min-width: 46px;
        text-align: center;
      }

      .get    { background: #e3f2fd; color: #1565c0; }
      .post   { background: #e8f5e9; color: #2e7d32; }
      .put    { background: #fff8e1; color: #f57f17; }
      .delete { background: #fce4ec; color: #c62828; }

      .path {
        font-family: "Courier New", monospace;
        color: #444;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="status-badge">Server Running</span>
      <h1>Ecommerce API</h1>
      <p>Backend REST API for the ecommerce project. Use the endpoints below to interact with the service.</p>

      <div class="endpoints">
        <h2>Available Routes</h2>

        <div class="endpoint">
          <span class="method get">GET</span>
          <span class="path">/api/order</span>
        </div>
        <div class="endpoint">
          <span class="method get">GET</span>
          <span class="path">/api/order/:id</span>
        </div>
        <div class="endpoint">
          <span class="method post">POST</span>
          <span class="path">/api/order</span>
        </div>
        <div class="endpoint">
          <span class="method put">PUT</span>
          <span class="path">/api/order/:id</span>
        </div>
        <div class="endpoint">
          <span class="method delete">DELETE</span>
          <span class="path">/api/order/:id</span>
        </div>
        <div class="endpoint">
          <span class="method get">GET</span>
          <span class="path">/api/user</span>
        </div>
        <div class="endpoint">
          <span class="method post">POST</span>
          <span class="path">/api/auth/login</span>
        </div>
        <div class="endpoint">
          <span class="method post">POST</span>
          <span class="path">/api/auth/logout</span>
        </div>
      </div>
    </div>
  </body>
</html>
